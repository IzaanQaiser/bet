[project]
name = "obligation-engine-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "google-cloud-pubsub>=2.27",
    "google-auth>=2.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obligation_engine_shared"]
