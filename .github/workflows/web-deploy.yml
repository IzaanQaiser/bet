name: Deploy web/ to GitHub Pages

# plan Phase 1: build on push to main (only when web/ actually changed),
# publish the static export to the gh-pages branch. GitHub Pages itself
# (manual setup step 4) needs to be pointed at that branch once this
# workflow has run at least once.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/out
          # keep it a single-commit history on gh-pages, not an ever-growing log
          force_orphan: true
