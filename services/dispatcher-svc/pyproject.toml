[project]
name = "dispatcher-svc"
version = "0.1.0"
requires-python = ">=3.12"
# No runtime deps yet — step 7 is the capacity engine only (pure stdlib:
# dataclasses, datetime, math). FastAPI/uvicorn/Calendar client land in
# step 8 when this becomes an actual deployed service.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatcher_svc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
