[project]
name = "resolver-svc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "obligation-engine-shared",
    "twilio>=9.3",
    "google-adk>=2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
]

[tool.uv.sources]
obligation-engine-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resolver_svc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
